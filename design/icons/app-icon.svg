<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Brimline</title>
  <!-- Grille d'icônes macOS : carré arrondi de 824 à 100 du bord, ombre portée. Même dessin que src/main.swift (drawIcon). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C333A"/><stop offset="1" stop-color="#111417"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="554" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3BBDC2" stop-opacity="0.20"/><stop offset="1" stop-color="#3BBDC2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="712" x2="0" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E7C86"/><stop offset="1" stop-color="#4FD0D6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6EAED"/><stop offset="1" stop-color="#8C959D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185.4"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="#14181B" filter="url(#shadow)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#halo)"/>
    <!-- verre -->
    <rect x="412" y="312" width="200" height="400" fill="#FFFFFF" fill-opacity="0.07"/>
    <!-- liquide à 62 %, ménisque -->
    <rect x="428" y="464" width="168" height="248" fill="url(#liquid)"/>
    <rect x="428" y="464" width="168" height="10" fill="#A6ECEE" fill-opacity="0.85"/>
    <!-- parois -->
    <rect x="412" y="312" width="12" height="400" fill="#FFFFFF" fill-opacity="0.30"/>
    <rect x="600" y="312" width="12" height="400" fill="#FFFFFF" fill-opacity="0.30"/>
    <!-- reflet et graduations 25, 50, 75 % -->
    <rect x="446" y="336" width="18" height="352" rx="9" fill="#FFFFFF" fill-opacity="0.22"/>
    <g fill="#FFFFFF" fill-opacity="0.55">
      <rect x="560" y="609" width="32" height="6"/><rect x="540" y="509" width="52" height="6"/><rect x="560" y="409" width="32" height="6"/>
    </g>
    <!-- brides métalliques ; celle du haut figure la limite -->
    <g>
      <rect x="352" y="248" width="320" height="64" rx="20" fill="url(#metal)"/>
      <rect x="352" y="712" width="320" height="64" rx="20" fill="url(#metal)"/>
      <g fill="#5A636B"><circle cx="392" cy="280" r="13"/><circle cx="632" cy="280" r="13"/><circle cx="392" cy="744" r="13"/><circle cx="632" cy="744" r="13"/></g>
      <g fill="#FFFFFF" fill-opacity="0.35"><ellipse cx="390.5" cy="275.5" rx="4.5" ry="3.5"/><ellipse cx="630.5" cy="275.5" rx="4.5" ry="3.5"/><ellipse cx="390.5" cy="739.5" rx="4.5" ry="3.5"/><ellipse cx="630.5" cy="739.5" rx="4.5" ry="3.5"/></g>
    </g>
    <rect x="102" y="102" width="820" height="820" rx="183.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
  </g>
</svg>
