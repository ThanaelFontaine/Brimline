<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" fill="currentColor" role="img" aria-label="Brimline">
  <!-- Glyphe paramétrable, piste B · Le b : à insérer en ligne, niveau par la variable CSS --level (0 à 1).
       En <img>, la variable ne passe pas : le niveau par défaut (0,6) s'affiche. -->
  <path fill-rule="evenodd" d="M3 1.75A0.75 0.75 0 0 1 4.5 1.75V5H11A4 4 0 0 1 15 9V13A4 4 0 0 1 11 17H3ZM4.5 6.5H11A2.5 2.5 0 0 1 13.5 9V13A2.5 2.5 0 0 1 11 15.5H4.5Z"/>
  <rect x="6" y="8" width="6" height="6" rx="0.75" style="transform-origin: 0 14px; transform: scaleY(var(--level, 0.6))"/>
</svg>
