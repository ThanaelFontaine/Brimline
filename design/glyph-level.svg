<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" fill="currentColor" role="img" aria-label="Sightglass">
  <!-- Glyphe paramétrable : à insérer en ligne dans le HTML, niveau par la variable CSS
       --level (0 à 1) posée sur l'élément ou un parent, par exemple style="--level: .7".
       En <img>, la variable ne passe pas : le niveau par défaut (0,6) s'affiche. -->
  <rect x="3" y="1" width="12" height="1.5" rx="0.5"/>
  <rect x="3" y="15.5" width="12" height="1.5" rx="0.5"/>
  <rect x="4.5" y="2.5" width="1.5" height="13"/>
  <rect x="12" y="2.5" width="1.5" height="13"/>
  <rect x="7" y="3.5" width="4" height="11" style="transform-origin: 0 14.5px; transform: scaleY(var(--level, 0.6))"/>
</svg>
