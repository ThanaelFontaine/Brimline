# Checks on every push and pull request: text rules (no em or en dash, no personal data), the
# tests of the repository scripts, then the Swift package (build, tests) and the app bundle
# (scripts/build_app.sh, universal, with the Command Line Tools only) and its disk image
# (scripts/build_dmg.sh, which also needs Python 3.10 or later, already on the runner image). The
# release workflow starts only after a green run of this one on main.
#
# Runner: the runners hosted by GitHub (macos-latest), never a machine of the maintainer. The
# repository is public and anyone can open a pull request, whose code runs in this workflow: it
# must run in a throwaway virtual machine with no personal data. The "Text rules" step below fails
# on the label that marks a runner as one's own (scripts/check_text.py). Pull requests from forks
# run here like the others, with a read-only token and no secret (permissions: contents: read).

name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # The Command Line Tools of the image, as on a developer's Mac without Xcode: the app is built
      # with them alone (scripts/build_app.sh). With the Xcode of the image selected, swift test
      # loads the Swift Testing macros of these tools and fails (the two Swift versions differ).
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@v7

      - name: Text rules
        run: python3 scripts/check_text.py

      - name: Script tests
        run: python3 -m unittest discover -s tests -v

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Swift tests
        run: swift test

      - name: App bundle
        run: scripts/build_app.sh

      - name: Disk image
        run: scripts/build_dmg.sh
