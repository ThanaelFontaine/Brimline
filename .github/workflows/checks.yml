# Checks on every push and pull request: text rules (no em or en dash, no personal data), the
# tests of the repository scripts, then the Swift package (build, tests) and the app bundle
# (scripts/build_app.sh, universal, with the Command Line Tools only) and its disk image
# (scripts/build_dmg.sh, which also needs Python 3.10 or later on the runner). The release workflow
# starts only after a green run of this one on main.
#
# Runner: the maintainer's Mac (self-hosted, under the maintainer's macOS account), kept when the
# repository is public. Anyone can then open a pull request, and its code would run on that Mac.
# The barrier is the repository setting Settings, Actions, General, "Approval for running fork pull
# request workflows from contributors", on "Require approval for all external contributors" from
# the day the repository is public: a run from a fork waits for a maintainer, who approves it only
# after reading the code of the pull request. The `if` of the job below, which skips pull requests
# from forks, is defence in depth, not a protection: a fork can change this file in its pull request.
# With it, a pull request from a fork gets no run here, and GitHub counts a job skipped by `if` as
# passed, even for a required check: its code must be checked from a branch of this repository
# before merging.

name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Defence in depth: skips pull requests from forks. A fork can edit this line, so the barrier is
    # the approval setting described at the top of this file.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Text rules
        run: python3 scripts/check_text.py

      - name: Script tests
        run: python3 -m unittest discover -s tests -v

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Swift tests
        run: swift test

      - name: App bundle
        run: scripts/build_app.sh

      - name: Disk image
        run: scripts/build_dmg.sh
