name: Tmp signing experiment
on:
  push:
    branches: ['pc/THA-1839-**']
permissions:
  contents: read
jobs:
  exp:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Env
        run: |
          sw_vers
          whoami
          security list-keychains
          security default-keychain || true
          ls -la ~/Library/Keychains || true
      - name: Make a self-signed identity like Brimline's
        run: |
          cd "$RUNNER_TEMP"
          cat > o.cnf <<'CNF'
          [req]
          distinguished_name=dn
          x509_extensions=ext
          prompt=no
          [dn]
          CN=Brimline Code Signing
          O=Thanael Fontaine
          [ext]
          basicConstraints=critical,CA:false
          keyUsage=critical,digitalSignature
          extendedKeyUsage=critical,codeSigning
          CNF
          /usr/bin/openssl req -x509 -newkey rsa:3072 -nodes -keyout k.pem -out c.pem -days 30 -config o.cnf
          /usr/bin/openssl pkcs12 -export -inkey k.pem -in c.pem -out t.p12 -passout pass:pw
          base64 < t.p12 > p12.b64
      - name: Import
        run: |
          export P12="$(cat "$RUNNER_TEMP/p12.b64")" P12_PASSWORD=pw
          scripts/import_signing_identity.sh
      - name: Variants
        run: |
          set +e
          cp /bin/ls "$RUNNER_TEMP/bin_ls"
          echo "--- find-identity"; security find-identity -p codesigning "$BRIMLINE_SIGNING_KEYCHAIN"
          echo "--- A: --keychain"; codesign --force -s "$BRIMLINE_SIGNING_IDENTITY" --keychain "$BRIMLINE_SIGNING_KEYCHAIN" "$RUNNER_TEMP/bin_ls"; echo "A rc=$?"
          echo "--- B: no --keychain"; codesign --force -s "$BRIMLINE_SIGNING_IDENTITY" "$RUNNER_TEMP/bin_ls"; echo "B rc=$?"
          echo "--- C: list-keychains"
          security list-keychains -d user -s "$BRIMLINE_SIGNING_KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security list-keychains
          codesign --force -s "$BRIMLINE_SIGNING_IDENTITY" "$RUNNER_TEMP/bin_ls"; echo "C rc=$?"
          codesign --force -s "$BRIMLINE_SIGNING_IDENTITY" --keychain "$BRIMLINE_SIGNING_KEYCHAIN" "$RUNNER_TEMP/bin_ls"; echo "C2 rc=$?"
          echo "--- D: trust"
          security find-certificate -c "Brimline Code Signing" -p "$BRIMLINE_SIGNING_KEYCHAIN" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$BRIMLINE_SIGNING_KEYCHAIN" "$RUNNER_TEMP/cert.pem"; echo "trust rc=$?"
          security find-identity -p codesigning "$BRIMLINE_SIGNING_KEYCHAIN"
          codesign --force -s "$BRIMLINE_SIGNING_IDENTITY" --keychain "$BRIMLINE_SIGNING_KEYCHAIN" "$RUNNER_TEMP/bin_ls"; echo "D rc=$?"
          codesign --force -s "$BRIMLINE_SIGNING_IDENTITY" "$RUNNER_TEMP/bin_ls"; echo "D2 rc=$?"
