# Every version has its GitHub release, created by the CI together with the tag, with the notes
# of its "## [X.Y.Z]" section in CHANGELOG.md (never a generic note).
#
# Trigger: after a GREEN run of the "Checks" workflow on a push to main.
# 1. Reads VERSION. 0.0.0 is the development version: nothing is released.
# 2. If release vX.Y.Z already exists, there is nothing to do.
# 3. Otherwise it creates the tag on the checked commit (or reuses a tag that already points
#    there) and the release with the notes. Re-running is safe.
#
# Events created with GITHUB_TOKEN (the tag, the release) do not start other workflows: the whole
# chain starts here. Never create a tag or a release by hand.

name: Release

on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Version and notes
        id: plan
        run: |
          VERSION="$(python3 scripts/release_notes.py version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "0.0.0" ]; then
            echo "Version 0.0.0 is the development version: no release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          python3 scripts/release_notes.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Tag and release
        if: ${{ steps.plan.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: nothing to do."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-list -n 1 "$TAG")" != "$HEAD_SHA" ]; then
              echo "::error::Tag $TAG exists on another commit: bump VERSION instead of moving a tag."
              exit 1
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --target "$HEAD_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "Release $TAG created."
